name: Audit provisional model identities
on:
  push:
    branches:
      - identity-quality-review-2026-10
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit provisional identity references
        run: node tools/audit-pending-identities.cjs
      - name: Verify canonical integration
        run: node tests/canonical-integration.cjs
