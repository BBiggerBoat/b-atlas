name: Reconcile canonical model identity registry
on:
  workflow_dispatch:
  push:
    branches:
      - canonical-consolidation-2026-10
    paths:
      - tools/reconcile-model-registry.cjs
      - .github/workflows/reconcile-model-registry.yml
permissions:
  contents: write
jobs:
  reconcile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: canonical-consolidation-2026-10
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconcile identity registry
        run: node tools/reconcile-model-registry.cjs
      - name: Verify regenerated registry
        run: node tools/reconcile-model-registry.cjs --check
      - name: Commit branch-only registry update
        run: |
          if git diff --quiet -- data/registry/boat-registry.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/registry/boat-registry.json
          git commit -m "Reconcile canonical model identities"
          git push origin HEAD:canonical-consolidation-2026-10
