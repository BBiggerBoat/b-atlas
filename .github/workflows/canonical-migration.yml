name: Verify canonical architecture
on:
  pull_request:
  push:
    branches: [dev/canonical-json-migration]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm run verify:production
      - uses: actions/upload-artifact@v4
        with:
          name: canonical-migration-review
          path: dist/
          retention-days: 7
