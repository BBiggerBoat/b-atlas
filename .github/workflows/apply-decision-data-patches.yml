name: Apply decision data patches

on:
  push:
    paths:
      - "data/decision-data-patches.json"
      - ".github/workflows/apply-decision-data-patches.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: decision-data-patches-main
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply canonical model patches
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const modelPath="boatmodels.json";
          const patchPath="data/decision-data-patches.json";
          const models=JSON.parse(fs.readFileSync(modelPath,"utf8"));
          const doc=JSON.parse(fs.readFileSync(patchPath,"utf8"));
          const patches=Array.isArray(doc.patches)?doc.patches:[];
          const byId=new Map(models.map((r,i)=>[r.BoatModelID,{r,i}]));
          const applied=[],missing=[];
          for(const p of patches){
            const hit=byId.get(p.BoatModelID);
            if(!hit){missing.push(p.BoatModelID);continue;}
            const fields=p.fields||{};
            Object.assign(hit.r,fields);
            hit.r.SpecificationConfidence={...(hit.r.SpecificationConfidence||{}),...(p.confidence||{})};
            hit.r.DecisionDataSource=p.sourceURL||hit.r.DecisionDataSource||null;
            hit.r.LastUpdated="2026-10-05";
            applied.push({BoatModelID:p.BoatModelID,fields:Object.keys(fields)});
          }
          if(missing.length) {
            console.error("Missing model IDs:",missing);
            process.exit(2);
          }
          fs.writeFileSync(modelPath,JSON.stringify(models,null,2)+"\n");
          fs.mkdirSync("reports",{recursive:true});
          fs.writeFileSync("reports/decision-data-patch-apply.json",JSON.stringify({
            generatedAt:new Date().toISOString(),
            patchSet:doc.patchSet||null,
            appliedCount:applied.length,
            applied
          },null,2)+"\n");
          console.log(JSON.stringify({patchSet:doc.patchSet,appliedCount:applied.length,applied},null,2));
          NODE
      - name: Regenerate decision data coverage
        shell: bash
        run: |
          node <<'NODE'
          const fs=require("fs");
          const rows=JSON.parse(fs.readFileSync("boatmodels.json","utf8"));
          const has=v=>v!==null&&v!==undefined&&!(typeof v==="string"&&!v.trim());
          const checks={
            LOA:r=>has(r.LOA)||has(r.LOA_ft)||has(r.LengthFt),
            Beam:r=>has(r.Beam)||has(r.Beam_ft)||has(r.BeamFt),
            Draft:r=>has(r.Draft)||has(r.Draft_ft)||has(r.DraftFt),
            AirDraft:r=>has(r.AirDraft)||has(r.AirDraft_ft),
            FuelType:r=>has(r.FuelCode)||has(r.NormalizedFuel)||has(r.Fuel),
            Propulsion:r=>has(r.MechanicalPropulsionCode)||has(r.NormalizedPropulsion)||has(r.Propulsion),
            HullForm:r=>has(r.HullBehaviourCode)||has(r.NormalizedHullForm)||has(r.NormalizedHullType)||has(r.HullType),
            Style:r=>has(r.BoatFamilyCode)||has(r.StyleCode)||has(r.NormalizedStyle)||has(r.Style),
            EngineConfig:r=>has(r.EngineConfiguration)||has(r.EngineCount)||has(r.TypicalEngineID),
            Displacement:r=>has(r.Displacement)||has(r.DisplacementLb)||has(r.Displacement_lb),
            FuelCapacity:r=>has(r.FuelCapacity)||has(r.FuelCapacityGal),
            WaterCapacity:r=>has(r.WaterCapacity)||has(r.WaterCapacityGal)
          };
          const priority=["Beam","LOA","FuelType","Propulsion","HullForm","Draft","AirDraft","Style","EngineConfig","Displacement","FuelCapacity","WaterCapacity"];
          const coverage={},missingByManufacturer={};
          for(const [field,fn] of Object.entries(checks)){
            const missing=rows.filter(r=>!fn(r));
            coverage[field]={known:rows.length-missing.length,missing:missing.length,pct:Number((((rows.length-missing.length)/rows.length)*100).toFixed(1))};
            const by={}; for(const r of missing){const m=r.Manufacturer||"Unknown";by[m]=(by[m]||0)+1;}
            missingByManufacturer[field]=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([manufacturer,missing])=>({manufacturer,missing}));
          }
          const core=priority.slice(0,10);
          const scored=rows.map(r=>{const gaps=core.filter(f=>!checks[f](r));return {BoatModelID:r.BoatModelID,Manufacturer:r.Manufacturer,Nickname:r.Nickname||[r.Manufacturer,r.Model].filter(Boolean).join(" "),missing:gaps.length,gaps};})
            .sort((a,b)=>b.missing-a.missing||String(a.Manufacturer).localeCompare(String(b.Manufacturer))||String(a.Nickname).localeCompare(String(b.Nickname)));
          const report={generatedAt:new Date().toISOString(),models:rows.length,priority,coverage,missingByManufacturer,highestGapModels:scored.slice(0,100)};
          fs.writeFileSync("reports/decision-data-coverage.json",JSON.stringify(report,null,2)+"\n");
          let md="# B-Atlas Decision Data Coverage Audit\n\n";
          md+=`Generated: ${report.generatedAt}\n\nCanonical models: **${rows.length}**\n\n`;
          md+="## Coverage by decision field\n\n| Priority | Field | Known | Missing | Coverage |\n|---:|---|---:|---:|---:|\n";
          priority.forEach((x,i)=>{const c=coverage[x];md+=`| ${i+1} | ${x} | ${c.known} | ${c.missing} | ${c.pct}% |\n`;});
          fs.writeFileSync("reports/decision-data-coverage.md",md);
          NODE
      - name: Commit canonical updates
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boatmodels.json reports/decision-data-patch-apply.json reports/decision-data-coverage.json reports/decision-data-coverage.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Apply decision data patches"
          git push
