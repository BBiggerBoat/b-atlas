name: Deploy B-Atlas Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Verify baseline version
        run: npm run guard:baseline

      - name: Build allowlisted public site
        run: npm run build:public

      - name: Verify sensitive source files are excluded
        shell: bash
        run: |
          test ! -e dist/server.js
          test ! -e dist/package.json
          test ! -e dist/moderatoraccess.js
          test ! -e dist/cloudflare
          test ! -e dist/developer/__pycache__
          test ! -e dist/developer/generate-search-landing-pages.py
          test ! -e dist/PRIMARY_FILE_INVENTORY.txt
          test -e dist/index.html
          test -e dist/boatmodels.json
          test -e dist/CNAME
          test -e dist/developer/contribution-review.html

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
