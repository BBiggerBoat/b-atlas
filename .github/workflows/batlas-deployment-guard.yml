name: B-Atlas Deployment Guard

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  baseline-guard:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Verify baseline version
        run: npm run guard:baseline
      - name: Build allowlisted public site
        run: npm run build:public
      - name: Verify internal files are excluded
        shell: bash
        run: |
          test ! -e dist/server.js
          test ! -e dist/package.json
          test ! -e dist/moderatoraccess.js
          test ! -e dist/cloudflare
          test ! -e dist/developer/__pycache__
          test ! -e dist/developer/generate-search-landing-pages.py
          test ! -e dist/PRIMARY_FILE_INVENTORY.txt
          test -e dist/index.html
          test -e dist/boatmodels.json
          test -e dist/developer/contribution-review.html
          test -e dist/developer/moderatorapi.js
      - name: Verify public/admin API separation
        shell: bash
        run: |
          ! grep -q "/api/admin/" dist/communityapi.js
          ! grep -q "setAdminToken" dist/communityapi.js
          ! grep -q "moderatorapi.js" dist/index.html
          grep -q "moderatorapi.js" dist/developer/contribution-review.html
          grep -q "/api/admin/" dist/developer/moderatorapi.js
      - name: Verify authentication hardening
        shell: bash
        run: |
          ! grep -q 'searchParams.get("token")' functions/_lib/bscout-store.js
          ! grep -q 'searchParams.get("token")' cloudflare/batlas-api-standalone.js
          grep -q "adminOriginAllowed" cloudflare/batlas-api-standalone.js
          grep -q "recordAdminAuthFailure" cloudflare/batlas-api-standalone.js
          grep -q "sessionStorage.removeItem(TOKEN_KEY)" dist/developer/moderatorapi.js
      - name: Verify Phase 1J extraction protection
        shell: bash
        run: |
          grep -q 'namespace:"contribution", limit:5' functions/_lib/bscout-store.js
          grep -q 'namespace:"contribution-day", limit:20' functions/_lib/bscout-store.js
          grep -q 'enforceLimit("overlays", 60' functions/api/\[\[path\]\].js
          grep -q 'enforceLimit("public-attachment", 30' functions/api/\[\[path\]\].js
          grep -q 'enforceLimit("admin-authenticated", 240' functions/api/\[\[path\]\].js
          grep -q 'Contribution origin not allowed' functions/api/\[\[path\]\].js
          grep -q 'Disallow: /boatmodels.json' robots.txt
          grep -q 'Phase 1J extraction / rate-limit protection' cloudflare/batlas-api-standalone.js
      - name: Verify Phase 1K upload security
        shell: bash
        run: |
          grep -q 'MAX_PHOTO_FILES = 8' functions/api/\[\[path\]\].js
          grep -q 'MAX_PHOTO_TOTAL_BYTES = 30' functions/api/\[\[path\]\].js
          grep -q 'MAX_DOCUMENT_BYTES = 25' functions/api/\[\[path\]\].js
          grep -q 'detectedMime' functions/api/\[\[path\]\].js
          grep -q 'Attachment type does not match file contents' functions/api/\[\[path\]\].js
          grep -q 'Attachment reference does not match contribution' functions/api/\[\[path\]\].js
          grep -q 'X-Content-Type-Options' functions/api/\[\[path\]\].js
          grep -q 'Content-Security-Policy' functions/api/\[\[path\]\].js
          grep -q 'Phase 1K contribution / upload security' cloudflare/batlas-api-standalone.js
